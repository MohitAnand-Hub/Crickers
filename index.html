
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cricket Team Setup</title>
</head>
<body>
  <h2>Enter Player Names</h2>
  <textarea id="players" rows="10" cols="50"></textarea><br>
  <button onclick="generateTeams()">Generate Teams</button>
  <pre id="output"></pre>
  <button id="next" onclick="location.href='score.html'" style="display:none;">Next: Match Score</button>

  <script>
    function generateTeams() {
      let input = document.getElementById('players').value.trim().split(/\n|,/).map(x => x.trim()).filter(Boolean);
      if (input.length < 4) return alert("Minimum 4 players required.");
      input.sort(() => Math.random() - 0.5);
      const teamA = input.slice(0, input.length / 2);
      const teamB = input.slice(input.length / 2);
      const [capA, vcA] = [teamA[0], teamA[1]];
      const [capB, vcB] = [teamB[0], teamB[1]];
      const data = {
        teamA: { players: teamA, captain: capA, viceCaptain: vcA },
        teamB: { players: teamB, captain: capB, viceCaptain: vcB }
      };
      localStorage.setItem("teams", JSON.stringify(data));
      document.getElementById("output").textContent = JSON.stringify(data, null, 2);
      document.getElementById("next").style.display = 'inline';
    }
  </script>
</body>
</html>
