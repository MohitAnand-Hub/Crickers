<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cricket Team Setup</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #FFFFFF;
      color: #1A1A1A;
      margin: 0;
      padding: 20px;
    }
    h2 {
      color: #0A2647;
    }
    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      resize: none;
    }
    button {
      background-color: #0A2647;
      color: #FFFFFF;
      border: none;
      padding: 10px 20px;
      margin-top: 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #D4AF37;
      color: #0A2647;
    }
    .team {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #0A2647;
      border-radius: 5px;
    }
    .captain {
      font-weight: bold;
      color: #D4AF37;
    }
    .vice {
      font-weight: bold;
      color: #0A2647;
    }
  </style>
</head>
<body>
  <h2>Cricket Team Generator</h2>
  <textarea id="playerInput" placeholder="Enter one player per line..."></textarea>
  <br>
  <button onclick="generateTeams()">Generate Teams</button>
  <div class="team" id="teamA"></div>
  <div class="team" id="teamB"></div>
  <button onclick="goToScorePage()" id="startMatchBtn" style="display:none;">Start Match</button>

  <script>
    let finalTeams = {};

    function getRandomIndices(arr, count) {
      const indices = [];
      while (indices.length < count) {
        const index = Math.floor(Math.random() * arr.length);
        if (!indices.includes(index)) indices.push(index);
      }
      return indices;
    }

    function generateTeams() {
      const input = document.getElementById("playerInput").value.trim();
      let players = input.split(/\n|,/).map(p => p.trim()).filter(p => p);

      if (players.length < 4) {
        alert("Minimum 4 players required.");
        return;
      }

      // Shuffle
      for (let i = players.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [players[i], players[j]] = [players[j], players[i]];
      }

      const half = Math.ceil(players.length / 2);
      const teamA = players.slice(0, half);
      const teamB = players.slice(half);

      const [capA, vcA] = getRandomIndices(teamA, 2);
      const [capB, vcB] = getRandomIndices(teamB, 2);

      finalTeams = {
        teamA: { name: "Team A", players: teamA, captain: teamA[capA], viceCaptain: teamA[vcA] },
        teamB: { name: "Team B", players: teamB, captain: teamB[capB], viceCaptain: teamB[vcB] }
      };

      document.getElementById("teamA").innerHTML = formatTeamHTML(finalTeams.teamA);
      document.getElementById("teamB").innerHTML = formatTeamHTML(finalTeams.teamB);
      document.getElementById("startMatchBtn").style.display = 'inline-block';
    }

    function formatTeamHTML(team) {
      return `
        <h3>${team.name}</h3>
        <ul>
          ${team.players.map(p => {
            if (p === team.captain) return `<li class="captain">${p} (Captain)</li>`;
            else if (p === team.viceCaptain) return `<li class="vice">${p} (Vice-Captain)</li>`;
            else return `<li>${p}</li>`;
          }).join('')}
        </ul>`;
    }

    function goToScorePage() {
      localStorage.setItem("teams", JSON.stringify(finalTeams));
      window.location.href = "score.html";
    }
  </script>
</body>
</html>
